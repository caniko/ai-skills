[package]
name = "skillctl"
version = "0.1.0"
edition = "2021"
description = "Reconcile and manage local AI skill mirrors"
license = "MIT"

[dependencies]
anyhow = "1.0"
camino = { version = "1.1", features = ["serde1"] }
clap = { version = "4.5", features = ["derive"] }
clap_complete = "4.5"
serde = { version = "1.0", features = ["derive"] }
sha2 = "0.10"
toml = "0.8"
toml_edit = "0.22"
walkdir = "2.5"

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
tempfile = "3.13"
