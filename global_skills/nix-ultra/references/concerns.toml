screen = "always"
threshold = 8
gate = { kind = "any-file", globs = ["**/*.nix"] }
detectors = [{ kind = "literal", pattern = "mkOption", weight = 2, globs = ["**/*.nix"] }, { kind = "literal", pattern = "types.raw", weight = 4, globs = ["**/*.nix"] }, { kind = "literal", pattern = "freeformType", weight = 3, globs = ["**/*.nix"] }]

[[profile]]
id = "module-design.data-boundaries"
skill = "nix-module-design"
stage = "module-design"
procedure = "../../nix-module-design/references/data-boundaries.md"
