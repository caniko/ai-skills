[[profile]]
id = "code-health.module-layout"
skill = "nix-code-health"
stage = "code-health"
procedure = "../../nix-code-health/references/module-layout.md"
evaluation = "qualitative"
screen = "always"
threshold = 3
gate = { kind = "any-file", globs = ["**/*.nix"] }
detectors = [{ kind = "file-lines-gt", lines = 500, weight = 3, globs = ["**/*.nix"] }, { kind = "file-lines-lt", lines = 30, weight = 1, globs = ["**/*.nix"] }]

