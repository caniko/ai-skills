gate = { kind = "any-file", globs = ["**/*.nix"] }
detectors = [{ kind = "literal", pattern = "import ", weight = 1, globs = ["**/*.nix"] }, { kind = "literal", pattern = "lib.", weight = 1, globs = ["**/*.nix"] }]

[[profile]]
