schema_version = 1

# Qualitative profiles always screen during a whole-repository run. Detectors
# prioritize candidate-heavy profiles; they never suppress their review.

[[profile]]
id = "correctness.eval-failures"
skill = "nix-correctness"
stage = "correctness"
procedure = "../../nix-correctness/references/eval-failures.md"
evaluation = "qualitative"
screen = "always"
threshold = 6
gate = { kind = "any-file", globs = ["**/*.nix"] }
detectors = [{ kind = "literal", pattern = "throw", weight = 2, globs = ["**/*.nix"] }, { kind = "literal", pattern = "assert", weight = 2, globs = ["**/*.nix"] }, { kind = "literal", pattern = "mkForce", weight = 2, globs = ["**/*.nix"] }]

[[profile]]
id = "correctness.store-purity"
skill = "nix-correctness"
stage = "correctness"
procedure = "../../nix-correctness/references/store-purity.md"
evaluation = "qualitative"
screen = "always"
threshold = 6
gate = { kind = "any-file", globs = ["**/*.nix"] }
detectors = [{ kind = "literal", pattern = "builtins.getFlake", weight = 4, globs = ["**/*.nix"] }, { kind = "literal", pattern = "fetchGit", weight = 4, globs = ["**/*.nix"] }, { kind = "literal", pattern = "/home/", weight = 3, globs = ["**/*.nix"] }, { kind = "literal", pattern = "/data/", weight = 3, globs = ["**/*.nix"] }]

[[profile]]
id = "security.secrets"
skill = "nix-security"
stage = "security"
procedure = "../../nix-security/references/secrets.md"
evaluation = "qualitative"
screen = "always"
threshold = 8
gate = { kind = "any-file", globs = ["**/*.nix"] }
detectors = [{ kind = "literal", pattern = "age.secrets", weight = 3, globs = ["**/*.nix"] }, { kind = "literal", pattern = "sops.secrets", weight = 3, globs = ["**/*.nix"] }, { kind = "literal", pattern = "LoadCredential", weight = 3, globs = ["**/*.nix"] }, { kind = "literal", pattern = "environmentFile", weight = 2, globs = ["**/*.nix"] }]

[[profile]]
id = "module-design.module-design"
skill = "nix-module-design"
stage = "module-design"
procedure = "../../nix-module-design/references/module-design.md"
evaluation = "qualitative"
screen = "always"
threshold = 8
gate = { kind = "any-file", globs = ["**/*.nix"] }
detectors = [{ kind = "literal", pattern = "mkMerge", weight = 2, globs = ["**/*.nix"] }, { kind = "literal", pattern = "mkIf", weight = 1, globs = ["**/*.nix"] }, { kind = "literal", pattern = "imports =", weight = 1, globs = ["**/*.nix"] }]

[[profile]]
id = "module-design.options-typing"
skill = "nix-module-design"
stage = "module-design"
procedure = "../../nix-module-design/references/options-typing.md"
