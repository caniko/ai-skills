schema_version = 1

# Qualitative profiles always screen during a whole-codebase run. Detectors
# prioritize candidate-heavy profiles; they never suppress their review.

[[profile]]
id = "correctness.concurrency"
skill = "rust-correctness"
stage = "correctness"
procedure = "../../rust-correctness/references/concurrency.md"
evaluation = "qualitative"
screen = "always"
threshold = 8
gate = { kind = "any-file", globs = ["**/*.rs"] }
detectors = [{ kind = "literal", pattern = ".await", weight = 1, globs = ["**/*.rs"] }, { kind = "literal", pattern = "Mutex", weight = 2, globs = ["**/*.rs"] }, { kind = "literal", pattern = "tokio::spawn", weight = 2, globs = ["**/*.rs"] }]

[[profile]]
id = "correctness.fail-fast"
skill = "rust-correctness"
stage = "correctness"
procedure = "../../rust-correctness/references/fail-fast.md"
evaluation = "qualitative"
screen = "always"
threshold = 8
gate = { kind = "any-file", globs = ["**/*.rs"] }
detectors = [{ kind = "literal", pattern = "panic!(", weight = 3, globs = ["**/*.rs"] }, { kind = "literal", pattern = "unreachable!(", weight = 2, globs = ["**/*.rs"] }]

[[profile]]
id = "correctness.panic-paths"
skill = "rust-correctness"
stage = "correctness"
procedure = "../../rust-correctness/references/panic-paths.md"
evaluation = "qualitative"
screen = "always"
threshold = 6
gate = { kind = "any-file", globs = ["**/*.rs"] }
detectors = [{ kind = "literal", pattern = "assert!(", weight = 1, globs = ["**/*.rs"] }, { kind = "literal", pattern = "[", weight = 1, globs = ["**/*.rs"] }]

[[profile]]
id = "correctness.unwraps"
skill = "rust-correctness"
stage = "correctness"
procedure = "../../rust-correctness/references/unwraps.md"
evaluation = "qualitative"
screen = "always"
threshold = 10
gate = { kind = "any-file", globs = ["**/*.rs"] }
detectors = [{ kind = "literal", pattern = ".unwrap()", weight = 1, globs = ["**/*.rs"] }, { kind = "literal", pattern = ".expect(", weight = 1, globs = ["**/*.rs"] }]

[[profile]]
id = "security.application"
skill = "rust-security"
stage = "security"
procedure = "../../rust-security/references/security.md"
evaluation = "qualitative"
screen = "always"
threshold = 6
gate = { kind = "any-file", globs = ["Cargo.toml", "**/Cargo.toml"] }
detectors = [{ kind = "literal", pattern = "Command::new", weight = 2, globs = ["**/*.rs"] }, { kind = "literal", pattern = "password", weight = 1, globs = ["**/*.rs", "**/*.toml"] }]

[[profile]]
id = "security.unsafe-soundness"
skill = "rust-security"
stage = "security"
procedure = "../../rust-security/references/unsafe-soundness.md"
evaluation = "qualitative"
screen = "always"
threshold = 5
gate = { kind = "any-file", globs = ["**/*.rs"] }
detectors = [{ kind = "literal", pattern = "unsafe ", weight = 3, globs = ["**/*.rs"] }, { kind = "literal", pattern = "transmute", weight = 5, globs = ["**/*.rs"] }, { kind = "literal", pattern = "from_raw", weight = 4, globs = ["**/*.rs"] }]

[[profile]]
id = "design.api-guidelines"
skill = "rust-api-design"
stage = "design"
procedure = "../../rust-api-design/references/api-guidelines.md"
evaluation = "qualitative"
screen = "always"
threshold = 6
gate = { kind = "any-file", globs = ["**/*.rs"] }
detectors = [{ kind = "literal", pattern = "pub fn ", weight = 1, globs = ["**/*.rs"] }, { kind = "literal", pattern = "pub struct ", weight = 1, globs = ["**/*.rs"] }]

[[profile]]
id = "design.errors"
skill = "rust-api-design"
stage = "design"
procedure = "../../rust-api-design/references/errors.md"
evaluation = "qualitative"
screen = "always"
threshold = 5
gate = { kind = "any-file", globs = ["**/*.rs"] }
detectors = [{ kind = "literal", pattern = "Box<dyn Error", weight = 3, globs = ["**/*.rs"] }, { kind = "literal", pattern = "Err(format!", weight = 2, globs = ["**/*.rs"] }]

[[profile]]
id = "design.trait-architecture"
skill = "rust-api-design"
stage = "design"
procedure = "../../rust-api-design/references/traits.md"
evaluation = "qualitative"
screen = "always"
threshold = 5
gate = { kind = "any-file", globs = ["**/*.rs"] }
detectors = [{ kind = "literal", pattern = "trait ", weight = 1, globs = ["**/*.rs"] }, { kind = "literal", pattern = "impl<", weight = 2, globs = ["**/*.rs"] }, { kind = "literal", pattern = "dyn ", weight = 1, globs = ["**/*.rs"] }]

[[profile]]
id = "design.type-safety"
skill = "rust-api-design"
stage = "design"
procedure = "../../rust-api-design/references/type-safety.md"
evaluation = "qualitative"
screen = "always"
threshold = 5
gate = { kind = "any-file", globs = ["**/*.rs"] }
detectors = [{ kind = "literal", pattern = ": String", weight = 1, globs = ["**/*.rs"] }, { kind = "literal", pattern = ": bool", weight = 1, globs = ["**/*.rs"] }]

[[profile]]
id = "design.type-cohesion"
skill = "rust-api-design"
stage = "design"
procedure = "../../rust-api-design/references/type-cohesion.md"
evaluation = "qualitative"
screen = "always"
threshold = 3
gate = { kind = "any-file", globs = ["**/*.rs"] }
detectors = [{ kind = "literal", pattern = "struct ", weight = 1, globs = ["**/*.rs"] }, { kind = "file-lines-gt", lines = 500, weight = 3, globs = ["**/*.rs"] }]

