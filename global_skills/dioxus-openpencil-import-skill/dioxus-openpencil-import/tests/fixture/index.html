<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    html, body { margin: 0; min-height: 100%; font-family: Arial, sans-serif; background: #eef2ff; }
    main { width: 720px; margin: 24px; padding: 24px; background: white; border: 2px solid #1f2937; border-radius: 18px; box-shadow: 0 8px 24px rgba(0,0,0,.15); }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
    .card { padding: 16px; border: 1px solid #cbd5e1; border-radius: 12px; background: #f8fafc; }
    h1 { margin: 0 0 18px; font-size: 28px; line-height: 34px; color: #111827; }
    p { margin: 8px 0 0; color: #475569; line-height: 22px; }
    button { margin-top: 16px; padding: 10px 14px; border: 0; border-radius: 8px; color: white; background: #4f46e5; font-weight: 700; }
  </style>
</head>
<body>
  <main id="app">
    <h1>Dioxus capture fixture</h1>
    <div class="row">
      <section class="card">
        <svg width="64" height="64" viewBox="0 0 64 64" aria-label="mark">
          <circle cx="32" cy="32" r="28" fill="#4f46e5" />
          <path d="M18 32l9 9 19-21" fill="none" stroke="white" stroke-width="6" />
        </svg>
        <p>Browser-computed grid geometry should become editable absolute frames.</p>
      </section>
      <section class="card">
        <label>Name <input value="Ada" style="display:block;margin-top:8px;width:220px;padding:8px;border:1px solid #94a3b8;border-radius:6px" /></label>
        <label style="display:block;margin-top:10px">Password <input type="password" value="supersecret" style="display:block;margin-top:8px;width:220px;padding:8px;border:1px solid #94a3b8;border-radius:6px" /></label>
        <button>Save changes</button>
      </section>
    </div>
  </main>
</body>
</html>
